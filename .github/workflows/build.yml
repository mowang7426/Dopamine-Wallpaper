name: Build wallpaper hook

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          brew install ldid
          git clone --depth 1 https://github.com/theos/theos.git "$HOME/theos"
          git clone --depth 1 https://github.com/theos/sdks.git "$HOME/theos/sdks"

      - name: Download original IPA input
        run: |
          mkdir -p input
          curl --fail --location --retry 3 \
            -o input/original.ipa \
            https://github.com/mowang7426/Dopamine-Wallpaper/releases/download/v0.1.0-input/original.ipa
          shasum -a 256 input/original.ipa

      - name: Build hook
        env:
          THEOS: ${{ env.HOME }}/theos
        run: |
          make -C . package FINALPACKAGE=1
          test -f .theos/obj/arm64/DopamineWallpaper.dylib

      - name: Package build inputs
        run: |
          mkdir -p output
          cp .theos/obj/arm64/DopamineWallpaper.dylib output/
          cp input/original.ipa output/original.ipa
          cp REPORT.md output/

      - name: Upload build inputs
        uses: actions/upload-artifact@v4
        with:
          name: dopamine-wallpaper-build
          path: output
          retention-days: 7
